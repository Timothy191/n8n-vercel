version: '3.8'

# n8n on Vercel - Docker Compose Configuration
# ==============================================
# This file provides a complete local development environment for n8n
# with optional Postgres database support.

# Usage:
#   - SQLite only: docker compose up -d
#   - With Postgres: docker compose --profile postgres up -d

services:
  # n8n Workflow Engine
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-app
    ports:
      - "3000:3000"
    environment:
      - N8N_PORT=3000
      - WEBHOOK_URL=http://localhost:3000
      - USE_POSTGRES=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      # Persist n8n workflows and configurations
      - n8n_data:/home/node/.n8n
      # Mount local files for development (optional)
      # - ./patch-fs.js:/entrypoint-fs-patch.js:ro
      # - ./entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - n8n-network
    depends_on:
      - postgres
    profiles:
      - postgres

  # Postgres Database (Optional)
  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    environment:
      POSTGRES_PASSWORD: n8n_dev_password
      POSTGRES_USER: n8n_user
      POSTGRES_DB: n8n_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-network
    profiles:
      - postgres

  # Postgres with PostGIS extension (for geospatial workflows)
  postgres-gis:
    image: postgis/postgis:15-3.3-alpine
    container_name: n8n-postgres-gis
    environment:
      POSTGRES_PASSWORD: n8n_dev_password
      POSTGRES_USER: n8n_user
      POSTGRES_DB: n8n_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_gis_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - n8n-network
    profiles:
      - postgis

networks:
  n8n-network:
    driver: bridge

volumes:
  # n8n persistent data
  n8n_data:
    driver: local

  # Postgres persistent data
  postgres_data:
    driver: local

  # PostGIS persistent data
  postgres_gis_data:
    driver: local